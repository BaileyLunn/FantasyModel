[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-model"
version = "0.1.0"
description = "NFL fantasy football expected-points prediction (ESPN half-PPR default)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "click>=8.1",
  "joblib>=1.3",
  "nfl-data-py>=0.3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
lightgbm = ["lightgbm>=4.0"]
xgboost = ["xgboost>=2.0"]

[project.scripts]
fantasy-model = "fantasy_model.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fantasy_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
